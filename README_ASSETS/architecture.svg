<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Definitions for Markers and Gradients -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <linearGradient id="grad-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #0b0f19; }
    .group-box { fill: #111827; stroke: #374151; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 12px; }
    .group-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #9ca3af; text-anchor: middle; letter-spacing: 0.05em; }
    .node-box-green { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 8px; }
    .node-box-blue { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8px; }
    .node-box-amber { fill: #1e293b; stroke: #f59e0b; stroke-width: 2; rx: 8px; }
    .node-box-slate { fill: #1e293b; stroke: #4b5563; stroke-width: 1.5; rx: 8px; }
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #9ca3af; }
    .header-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
    .header-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #6b7280; }
    .line-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #9ca3af; text-anchor: middle; }
    .badge { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; fill: #0f172a; }
  </style>

  <!-- Background -->
  <rect width="1000" height="600" class="bg" />

  <!-- Header -->
  <text x="40" y="50" class="header-title">N100 Financial Intelligence Platform</text>
  <text x="40" y="72" class="header-desc">System Architecture Overview — Ingestion, Validation, Storage, Analytics, and Presentation Layers</text>

  <!-- 1. DATA SOURCES -->
  <rect x="40" y="110" width="180" height="440" class="group-box" />
  <text x="130" y="130" class="group-label">1. INGESTION SOURCES</text>

  <!-- Node: Raw Excel files -->
  <g transform="translate(60, 160)">
    <rect width="140" height="80" class="node-box-slate" />
    <text x="15" y="30" class="title">Raw Datasets</text>
    <text x="15" y="48" class="subtitle">Nifty 100 Excel Files</text>
    <text x="15" y="63" class="subtitle">Historical Financials</text>
  </g>

  <!-- Node: Config YAML -->
  <g transform="translate(60, 270)">
    <rect width="140" height="80" class="node-box-slate" />
    <text x="15" y="30" class="title">YAML Configs</text>
    <text x="15" y="48" class="subtitle">screener_rules.yaml</text>
    <text x="15" y="63" class="subtitle">Threshold Parameters</text>
  </g>

  <!-- Node: Environment Configuration -->
  <g transform="translate(60, 380)">
    <rect width="140" height="80" class="node-box-slate" />
    <text x="15" y="30" class="title">Config Engine</text>
    <text x="15" y="48" class="subtitle">settings.py &amp; .env</text>
    <text x="15" y="63" class="subtitle">Centralized Paths</text>
  </g>

  <!-- Connection: Ingestion Sources to ETL -->
  <path d="M 220 200 L 260 200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="240" y="192" class="line-label">Load</text>

  <path d="M 220 310 L 260 310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="240" y="302" class="line-label">Configure</text>


  <!-- 2. DATA PROCESSING & VALIDATION -->
  <rect x="260" y="110" width="220" height="440" class="group-box" />
  <text x="370" y="130" class="group-label">2. PARSING &amp; DQ CORE</text>

  <!-- Node: ETL Parser & Normalizers -->
  <g transform="translate(280, 160)">
    <rect width="180" height="80" class="node-box-blue" />
    <text x="15" y="30" class="title">ETL Parser Engine</text>
    <text x="15" y="48" class="subtitle">loader.py &amp; normalizer.py</text>
    <text x="15" y="63" class="subtitle">Ticker &amp; Date Standardizers</text>
  </g>

  <!-- Node: DQ Validation Engine -->
  <g transform="translate(280, 290)">
    <rect width="180" height="110" class="node-box-green" />
    <text x="15" y="30" class="title">16 DQ Rules Evaluator</text>
    <text x="15" y="48" class="subtitle">validator.py</text>
    <text x="15" y="68" class="subtitle" fill="#10b981" font-weight="bold">✓ 5 Critical Blockers</text>
    <text x="15" y="85" class="subtitle" fill="#38bdf8" font-weight="bold">✓ 11 Non-Blockers</text>
  </g>

  <!-- Node: Rejections Logs -->
  <g transform="translate(280, 430)">
    <rect width="180" height="70" class="node-box-amber" />
    <text x="15" y="28" class="title">Rejections &amp; Logs</text>
    <text x="15" y="45" class="subtitle">output/validation/</text>
    <text x="15" y="58" class="subtitle">CSV &amp; Warning Anomalies</text>
  </g>

  <!-- Connections within Processing -->
  <path d="M 370 240 L 370 290" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="390" y="268" class="line-label">Validate</text>

  <path d="M 370 400 L 370 430" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="395" y="420" class="line-label" fill="#f59e0b">Failures</text>

  <!-- Connection: Processing to DB -->
  <path d="M 460 345 L 520 345" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="490" y="337" class="line-label" fill="#10b981">Clean Load</text>


  <!-- 3. RELATIONAL STORAGE -->
  <rect x="520" y="110" width="180" height="440" class="group-box" />
  <text x="610" y="130" class="group-label">3. DATABASE STORE</text>

  <!-- Node: SQLite Database -->
  <g transform="translate(540, 240)">
    <rect width="140" height="150" class="node-box-green" />
    <text x="15" y="30" class="title">SQLite DB</text>
    <text x="15" y="48" class="subtitle">nifty100.db</text>
    <text x="15" y="70" class="subtitle" font-weight="bold">✓ WAL Mode Enabled</text>
    <text x="15" y="88" class="subtitle">✓ FK Integrity Checked</text>
    <text x="15" y="106" class="subtitle">✓ Composite Keys</text>
    <text x="15" y="124" class="subtitle">✓ Auto-Backup Handler</text>
  </g>

  <!-- Node: Backup Store -->
  <g transform="translate(540, 430)">
    <rect width="140" height="70" class="node-box-slate" />
    <text x="15" y="30" class="title">Rotation Backups</text>
    <text x="15" y="48" class="subtitle">db/backups/</text>
    <text x="15" y="60" class="subtitle">Time-Stamped Files</text>
  </g>

  <!-- Connections within DB -->
  <path d="M 610 390 L 610 430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="635" y="415" class="line-label">Backup</text>

  <!-- Connection: DB to Analytics -->
  <path d="M 680 315 L 740 220" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="705" y="255" class="line-label" fill="#38bdf8">Query</text>

  <path d="M 680 345 L 740 440" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />


  <!-- 4. ANALYTICS & PRESENTATION -->
  <rect x="740" y="110" width="220" height="440" class="group-box" />
  <text x="850" y="130" class="group-label">4. CALCULATIONS &amp; UI</text>

  <!-- Node: Ratios Engine -->
  <g transform="translate(760, 160)">
    <rect width="180" height="90" class="node-box-blue" />
    <text x="15" y="28" class="title">Calculation Engines</text>
    <text x="15" y="45" class="subtitle">profitability.py &amp; cagr.py</text>
    <text x="15" y="60" class="subtitle">cashflow.py &amp; valuation.py</text>
    <text x="15" y="75" class="subtitle">presets.py (6 screeners)</text>
  </g>

  <!-- Node: Streamlit Presentation Layer -->
  <g transform="translate(760, 280)">
    <rect width="180" height="110" class="node-box-green" />
    <text x="15" y="30" class="title">Streamlit UI Dashboard</text>
    <text x="15" y="48" class="subtitle">app.py (7 Pages)</text>
    <text x="15" y="68" class="subtitle">✓ Executive Insights</text>
    <text x="15" y="83" class="subtitle">✓ Sector Relative Benchmarks</text>
    <text x="15" y="98" class="subtitle">✓ Watchlist &amp; Projections</text>
  </g>

  <!-- Node: API / PDF Reports -->
  <g transform="translate(760, 420)">
    <rect width="180" height="90" class="node-box-slate" />
    <text x="15" y="28" class="title">Exports &amp; Reports</text>
    <text x="15" y="45" class="subtitle">FastAPI REST Layer</text>
    <text x="15" y="60" class="subtitle">PDF ReportLab Compiler</text>
    <text x="15" y="75" class="subtitle">CSV/Excel Bulk Exporter</text>
  </g>

  <!-- Connection inside Analytics & Presentation -->
  <path d="M 850 250 L 850 280" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 850 390 L 850 420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

</svg>